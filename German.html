<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本格ドイツ料理｜茨木市</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", Arial, sans-serif;
      background: #fafafa;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: url("images/hero.jpg") center / cover no-repeat;
      color: white;
      text-align: center;
      padding: 80px 20px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    header p {
      font-size: 1rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    section {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .menu {
      margin-bottom: 40px;
    }

    .menu img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .menu h2 {
      font-size: 1.4rem;
      margin: 5px 0;
    }

    .price {
      font-weight: bold;
      color: #b00020;
    }

    .location {
      background: #fff3e0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 40px;
    }

    footer {
      background: #222;
      color: #ccc;
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>🇩🇪 本格ドイツ料理 🇩🇪</h1>
    <p>ドイツの伝統レシピを茨木市で</p>
  </header>

  <section>

    <div class="menu">
      <img src="https://tomoaki02040204-lgtm.github.io/Fun-cords/bratwrust.jpg" alt="ブラートヴルスト">
      <h2>ブラートヴルスト</h2>
      <p>肉汁たっぷりのドイツ定番焼きソーセージ。</p>
      <p class="price">¥850（税込）</p>
    </div>

    <div class="menu">
      <img src="images/schnitzel.jpg" alt="シュニッツェル">
      <h2>シュニッツェル</h2>
      <p>サクサク衣のドイツ風カツレツ。</p>
      <p class="price">¥1,200（税込）</p>
    </div>

    <div class="menu">
      <img src="images/eisbein.jpg" alt="アイスバイン">
      <h2>アイスバイン</h2>
      <p>じっくり煮込んだ豚すね肉。ビールと相性抜群。</p>
      <p class="price">¥1,800（税込）</p>
    </div>

    <div class="menu">
      <img src="images/pretzel.jpg" alt="プレッツェル">
      <h2>プレッツェル</h2>
      <p>外はカリッ、中はもっちり。本場の味。</p>
      <p class="price">¥350（税込）</p>
    </div>

    <div class="location">
      <h2>📍 茨木市で販売中</h2>
      <p>
        本格ドイツ料理を<br>
        茨木市でお楽しみいただけます。
      </p>
      <p>
        詳細・最新情報はLINEでご案内しています。
      </p>
    </div>

  </section>

  <footer>
    © German Food in Ibaraki
  </footer>

</body>
</html>
