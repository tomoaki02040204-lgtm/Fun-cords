<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🚨 SYSTEM ALERT 🚨</title>
<style>
  body {
    background-color: black;
    color: white;
    text-align: center;
    font-size: 3em;
    margin-top: 10%;
    transition: background-color 0.1s;
    background-size: cover;
    background-position: center;
  }

  #count {
    font-size: 4em;
    margin-bottom: 20px;
  }

  #status {
    font-size: 1.5em;
    color: red;
    margin-top: 20px;
  }

  .flash-redblue {
    animation: redblue 0.2s infinite alternate;
  }

  @keyframes redblue {
    from { background-color: darkred; }
    to { background-color: darkblue; }
  }

  #deleting {
    opacity: 0;
    animation: fade 1.2s infinite alternate;
  }

  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  button {
    font-size: 1em;
    padding: 10px 25px;
    background: red;
    color: white;
    border: none;
    border-radius: 5px;
  }

  #scareImage {
    display: none;
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0; left: 0;
    object-fit: cover;
    z-index: -1;
  }
</style>
</head>
<body>

<h1>🚨 SYSTEM ALERT 🚨</h1>
<button id="startBtn">Start</button>
<h1 id="count"></h1>
<div id="deleting"></div>
<div id="status"></div>
<img id="scareImage" src="https://i.imgur.com/vpRj1sR.jpeg">

<script>
// ======== 音源設定 ========
const siren = new Audio("https://actions.google.com/sounds/v1/emergency/police_siren.ogg");
const alarm = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
const complete = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

document.getElementById("startBtn").addEventListener("click", () => {
  // iPhone対応：事前再生で音声許可を取得
  [siren, alarm, complete].forEach(a => a.play().then(()=>a.pause()));

  const btn = document.getElementById("startBtn");
  const title = document.querySelector("h1");
  const countEl = document.getElementById("count");
  const deletingEl = document.getElementById("deleting");
  const statusEl = document.getElementById("status");
  const scareImg = document.getElementById("scareImage");

  btn.style.display = "none";
  title.style.display = "none";

  let c = 5;
  countEl.innerText = c;
  deletingEl.innerText = "警告: 不正アクセス検知";
  statusEl.innerText = "SYSTEM SECURITY BREACH DETECTED";
  document.body.classList.add("flash-redblue");

  // ======== カウントダウン ========
  let timer = setInterval(() => {
    c--;
    countEl.innerText = c;

    // 各カウント時にアラーム音を鳴らす（ループなし）
    alarm.currentTime = 0;
    alarm.play();

    if (c === 0) {
      clearInterval(timer);

      // ======== サイレン開始 ========
      siren.loop = true;
      siren.volume = 0.9;
      siren.play();

      deletingEl.innerText = "⚠ CRITICAL ERROR ⚠";
      deletingEl.style.animation = "none";
      deletingEl.style.opacity = "1";
      deletingEl.style.color = "red";

      scareImg.style.display = "block";
      statusEl.innerText = "警告: システム異常発生中...";

      // ======== 5秒後に解除 ========
      setTimeout(() => {
        siren.pause();
        document.body.classList.remove("flash-redblue");
        scareImg.style.display = "none";
        document.body.style.backgroundColor = "black";
        deletingEl.style.color = "lime";
        deletingEl.innerText = "✔ INITIALIZATION COMPLETE ✔";
        statusEl.innerText = "";
        complete.play();
      }, 5000);
    }
  }, 1000);
});
</script>

</body>
</html>
